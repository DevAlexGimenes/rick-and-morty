name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # iOS targets (iosX64/iosArm64/iosSimulatorArm64) are declared in the KMP
      # modules but their native compile tasks require a macOS host and are
      # skipped automatically by the Kotlin Multiplatform plugin on Linux.
      # This job validates the Android target and all shared (commonMain/commonTest)
      # code. An iOS build job on macos-latest can be added once there's an
      # actual iOS release target.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
