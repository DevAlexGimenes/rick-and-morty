# P0 flow (issue #58, Phase 1): reach a Question screen mid-quiz, open the exit-confirmation
# dialog via the top bar's exit button, dismiss it (stay on the Question), reopen it, confirm it
# (leave), and land back on Home.
appId: com.gimenes.alex.rickandmorty
---
- launchApp
- tapOn: "Trivia Quiz"
- tapOn: "Character"
- tapOn: "Start Quiz"

# On a Question screen now (Question 1 of 10).
- assertVisible:
    text: "Question 1 of 10"

# Open the exit confirmation, then dismiss it ("Keep Playing").
- tapOn:
    id: "top_bar_exit_button"
- assertVisible:
    text: "Leave Quiz?"
- tapOn:
    id: "confirm_exit_dialog_dismiss"

# Still on the same Question screen - dismissing didn't navigate away.
- assertVisible:
    text: "Question 1 of 10"
- assertVisible:
    id: "quiz_answer_option_0"

# Reopen and this time confirm ("Leave Quiz").
- tapOn:
    id: "top_bar_exit_button"
- assertVisible:
    text: "Leave Quiz?"
- tapOn:
    id: "confirm_exit_dialog_confirm"

# Back on Home.
- assertVisible:
    id: "home_hero_kicker"
- assertVisible:
    text: "Trivia Quiz"
- assertVisible:
    text: "Guess the Character"
